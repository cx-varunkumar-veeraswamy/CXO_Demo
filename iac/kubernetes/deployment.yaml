# INTENTIONALLY INSECURE - Checkmarx One IaC demo only.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cxo-app, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: cxo } }
  template:
    metadata: { labels: { app: cxo } }
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      volumes:
        - name: host
          hostPath: { path: / }
        - name: sock
          hostPath: { path: /var/run/docker.sock }
      containers:
        - name: app
          image: nginx:latest
          ports: [{ containerPort: 80, hostPort: 80 }]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            readOnlyRootFilesystem: false
            capabilities: { add: ["SYS_ADMIN", "NET_RAW"] }
          env:
            - { name: DB_PASSWORD, value: "admin12345" }
          volumeMounts: [{ name: host, mountPath: /host }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: everyone-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [{ kind: Group, name: system:authenticated, apiGroup: rbac.authorization.k8s.io }]
---
apiVersion: v1
kind: Service
metadata: { name: cxo-svc }
spec: { type: LoadBalancer, selector: { app: cxo }, ports: [{ port: 80 }] }
---
apiVersion: v1
kind: Secret
metadata: { name: creds }
stringData: { password: "admin12345", token: "ghp_k8sHardcodedTokenExample1234567890" }
